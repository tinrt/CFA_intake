{% extends "base.html" %}

{% block title %}Donation Detail{% endblock %}

{% block content %}
<div class="panel" style="max-width:600px; margin:40px auto;">
    <h2>Donation Detail</h2>
    <form id="donation-detail-form" method="post">
        {% csrf_token %}
        <table style="width:100%; border-collapse:collapse;">
            <tr>
                <th style="text-align:left; padding:6px 8px; width:38%;">Date</th>
                <td style="padding:4px 8px;"><input type="date" name="donation_date" value="{{ donation.donation_date|date:'Y-m-d' }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Site</th>
                <td style="padding:4px 8px;"><input type="text" value="{{ donation.site.name }}" class="form-control" readonly style="background:#f5f5f5;" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Donor</th>
                <td style="padding:4px 8px;"><input type="text" name="donor_name" value="{{ donation.donor_name }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Type</th>
                <td style="padding:4px 8px;">
                    <select name="donor_type" class="form-control">
                        {% for value, label in donor_type_choices %}
                        <option value="{{ value }}" {% if donation.donor_type == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Organization</th>
                <td style="padding:4px 8px;"><input type="text" name="organization" value="{{ donation.organization }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Email</th>
                <td style="padding:4px 8px;"><input type="email" name="email" value="{{ donation.email }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Phone</th>
                <td style="padding:4px 8px;"><input type="text" name="phone_number" value="{{ donation.phone_number }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Address</th>
                <td style="padding:4px 8px;"><input type="text" name="address" value="{{ donation.address }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;"># of Bags</th>
                <td style="padding:4px 8px;"><input type="number" min="0" name="num_bags" value="{{ donation.num_bags }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;"># of Boxes</th>
                <td style="padding:4px 8px;"><input type="number" min="0" name="num_boxes" value="{{ donation.num_boxes }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Cash/Check $</th>
                <td style="padding:4px 8px;"><input type="number" step="0.01" min="0" name="cash_check" value="{{ donation.cash_check }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Gift Cards $</th>
                <td style="padding:4px 8px;"><input type="number" step="0.01" min="0" name="gift_cards" value="{{ donation.gift_cards }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Other Donation</th>
                <td style="padding:4px 8px;"><input type="text" name="other_donation" value="{{ donation.other_donation }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px;">Total Weight (lbs)</th>
                <td style="padding:4px 8px;"><input type="number" step="0.01" min="0" name="total_weight" value="{{ donation.total_weight }}" class="form-control" /></td>
            </tr>
            <tr>
                <th style="text-align:left; padding:6px 8px; vertical-align:top;">Notes</th>
                <td style="padding:4px 8px;"><textarea name="notes" class="form-control" rows="3">{{ donation.notes }}</textarea></td>
            </tr>
        </table>
        <div id="detail-save-error" style="color:red; margin-top:8px; display:none;"></div>
        <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
            <button type="button" class="btn btn-danger" id="delete-donation-btn">&#128465;Delete</button>
            <div>
                <button type="button" class="btn btn-success" id="save-donation-btn">&#128190;Save</button>
                <a href="{% url 'donation-log' %}" class="btn btn-secondary">Back to Log</a>
            </div>
        </div>
    </form>
</div>

<script>
(function() {
    function getCsrf() {
        const el = document.querySelector('#donation-detail-form [name=csrfmiddlewaretoken]');
        return el ? el.value : '';
    }

    document.getElementById('save-donation-btn').onclick = function() {
        const form = document.getElementById('donation-detail-form');
        const data = new FormData(form);
        const errBox = document.getElementById('detail-save-error');
        errBox.style.display = 'none';
        fetch('{% url "donation-edit" donation.pk %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrf() },
            body: data
        })
        .then(r => r.json())
        .then(resp => {
            if (resp.success) {
                const btn = document.getElementById('save-donation-btn');
                btn.textContent = '\u2714 Saved';
                btn.disabled = true;
                setTimeout(() => { btn.innerHTML = '&#128190; Save'; btn.disabled = false; }, 2000);
            } else {
                const msgs = Object.values(resp.errors || {}).flat().join(' ');
                errBox.textContent = msgs || 'Failed to save.';
                errBox.style.display = 'block';
            }
        })
        .catch(() => {
            errBox.textContent = 'Network error. Please try again.';
            errBox.style.display = 'block';
        });
    };

    document.getElementById('delete-donation-btn').onclick = function() {
        if (!confirm('Delete this donation? This cannot be undone.')) return;
        fetch('{% url "donation-delete" donation.pk %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrf() }
        })
        .then(r => r.json())
        .then(resp => {
            if (resp.success) {
                window.location.href = '{% url "donation-log" %}';
            } else {
                alert('Failed to delete.');
            }
        });
    };
})();
</script>
{% endblock %}
